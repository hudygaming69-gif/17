<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Formularz</title>
</head>
<body>

<h2>Dla klientów</h2>
<form>
    <label>Ilu co najmniej pracowników potrzebujesz?</label>
    <input type="text" name="pracownicy">
    <input type="submit" value="Szukaj firm">
</form>

<br><br>

<h2>Dla wykonawców</h2>
<form>
    <label>Miasto:</label>
    <select name="miasto">
        <option>Darłowo</option>
        <option>Słupsk</option>
        <option>Koszalin</option>
    </select>
    <br>
    <input type="radio" name="usluga" value="malowanie" checked> malowanie<br>
    <input type="radio" name="usluga" value="gipsowanie"> gipsowanie<br><br>
    <input type="submit" value="Szukaj klientów">
</form>

</body>
</html>
